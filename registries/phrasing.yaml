# Plain-word labels, caveats and rounding (§10, §12).
version: v1
evidence_plain:
  delivery: "what the ad platform counted as delivered"
  platform_attributed: "what the ad platform credited to the ads"
  commercially_realized: "orders actually received"
  causally_incremental: "measured against a holdout group"
  deterministic: "arithmetic on the inputs"
route_plain:
  conjugate: "exact per-ad model"
  nuts: "joint funnel model"
  deterministic: "direct calculation"
caveat_marginal: "this estimate is still rough"
not_knowable: "not knowable yet"
not_knowable_block: >-
  Not knowable yet: {quantity}. We have {available}; we need about {required}. Getting there costs
  about {cost}.
watermark:
  demo: "DEMO: built from simulated data, not a client result"
  internal: "INTERNAL: not for client distribution"
rounding:
  percent_decimals: 1
  money_decimals: 0
  unit_money_decimals: 2  # live view: CPC and cost per conversion (build log B8)
  probability_decimals: 2
causal_lexicon:  # D29, D31: stems match every inflection; a hit counts only when an option is its subject or object in the clause
  plain: [cause, drive, drove, generate, lift, boost, increase, raise, produce, improve, impact, trigger,
          yield, help, create, "brought in", "bring in", "led to", "lead to", "leads to", "resulted in",
          "result in", "results in", "because of", "due to", "thanks to", "responsible for",
          "contributed to", "contribute to", "effect on", "driver of", "reason for", "pushed up",
          "made .* go up", "pushed .* up", "gets us", "got us", "brings in"]
  incremental: [incremental, incrementality]
  negation_frames: ["did not find that", "do not find that", "no evidence that", "nothing shows that",
                    "does not show that", "do not show that", "cannot say that", "cannot say whether",
                    "we cannot tell whether", "it is not known whether"]  # D31: only these negate a claim
comparative_lexicon:  # D29, D31: counts only when an option is the subject; direction from the clause's subject
  comparative: [better, worse, higher, lower, stronger, weaker, more, fewer, less, cheaper,
                "more expensive", outperform, underperform, beat, "ahead of", ahead, behind, trail,
                "superior to", superior, "inferior to", inferior, "wins against", win, won, lead,
                leading, "loses to", lose, lost]
  superlative: [best, worst, highest, lowest, strongest, weakest, cheapest, winner, loser,
                "top performer", "bottom performer", "top ad", "top campaign", leader, "the leader",
                first, last, "on top", "number one", "came out ahead"]
  generic_phrases: ["more data", "more time", "more clicks", "more conversions", "more evidence",
                    "at best", "at worst", "the better", "lower bound", "upper bound", "more reliable",
                    "less certain", "more certain", "first day", "last day", "first week", "last week"]  # D31: never comparatives
notices:
  too_few_ads: "funnel link not estimated: too few ads"
  lag_assumed: "conversion lag assumed"
  lag_approx: "lag-adjusted approximation"
  platform_modeled: "platform-modeled conversions"
  joint_failed: "joint model failed checks"
  waiting_late: "waiting for late conversions"
status_labels:  # live view §5 L3 C5 (D43); keys added, version unchanged (build log B3)
  below_floor: "below floor"
  marginal: "marginal"
  estimable: "estimable"
