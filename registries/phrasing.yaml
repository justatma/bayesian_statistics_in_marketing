  banner_error: "The latest poll failed at {at} UTC: {error}"
  banner_stale: "No good poll since {at} UTC ({hours} hours)."
  banner_interrupted: "The poll started at {at} UTC has no outcome: poll interrupted."
  no_poll: "No poll yet."
