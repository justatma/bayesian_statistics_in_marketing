[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-marketing"
version = "0.2.0.dev0"
description = "ENG-BAYES: the Bayesian marketing decision engine AtmaOS calls (spec v0.3)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "numpyro==0.22.0",
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "arviz>=1.3,<2",  # ArviZ 1.x API (F6)
    "jinja2>=3.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bayesian_marketing.live" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "piece(id): acceptance test for a spec piece; skipped until the piece merges",
    "slow: SBC and other long runs; run at P5's merge and nightly",
]
