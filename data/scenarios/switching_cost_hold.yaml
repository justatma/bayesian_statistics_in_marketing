# B is truly a little better than the incumbent A, but over a 1,000-click horizon the gain
# (0.003 x 1,000 x $32 = $96) is below a $250 switching cost, so the right action is hold
# (§8.2 C2; §9.2 "Hold"). The channel registry carries no switching cost (D13), so a test that
# exercises the hold sets learning_phase_switching_cost to the value in notes.
