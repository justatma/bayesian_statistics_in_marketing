# Manuscript ch. 10 (§9.2 "Delivery mix"): clicks move from 800/200 to 300/700 between an ad
# converting at 5% and one at 1%, so blended orders per 1,000 clicks fall from 42 to 22 with no
# change in either ad. Clicks per phase are fixed; conversions are drawn.
