# The Meta attribution setting changes from 7-day click / 1-day view to 1-day click on day 11.
# Reported conversions fall with no change in the ads; readers must split the series (§5.1 C5).
scenario: attribution_window_change
description: C5 split
client_id: window_co
currency: USD
utc_offset: "-05:00"
start_date: 2026-10-01
n_days: 21
platforms:
  meta:
    utm_source: facebook
    utm_medium: paid
    attribution_window: 7d_click_1d_view
    window_changes:
      - {from_day: 10, window: 1d_click}
lag: {median_days: 2}
order_value: {dist: lognormal, median: 60.0, sigma: 0.5, ad_log_sd: 0.05}
economics:
  variable_cost_per_order: "35.00"
  price_source: modeled_aov
  loss_tolerance: "50.00"
  source: synthetic scenario attribution_window_change
  approved_by: scenario file (synthetic)
  approved_at: "2026-11-03T00:00:00+00:00"
ads:
  - variant: A
    platform: meta
    account: {id: win_acc1, name: Window Co}
    campaign: {id: win_c1, name: Evergreen}
    ad_set: {id: win_as1, name: Broad}
    ad: {id: win_a, name: Ad A}
    utm_campaign: win_a
    truth: {ctr: 0.015, cvr: 0.03, cpm: 12.0}
    phases:
      - {days: 21, spend_per_day: "80.00"}
  - variant: B
    platform: meta
    account: {id: win_acc1, name: Window Co}
    campaign: {id: win_c1, name: Evergreen}
    ad_set: {id: win_as1, name: Broad}
    ad: {id: win_b, name: Ad B}
    utm_campaign: win_b
    truth: {ctr: 0.012, cvr: 0.035, cpm: 12.0}
    phases:
      - {days: 21, spend_per_day: "80.00"}
notes:
  window_change_day: 10
