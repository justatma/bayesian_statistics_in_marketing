# Median click-to-order lag of 4 days over a 10-day window: the last days' cohorts are immature,
# so a stop decision on them must be refused (§5.6 C3).
scenario: lag_heavy
description: median lag 4 days; premature stop refused
client_id: lag_co
currency: USD
utc_offset: "-05:00"
start_date: 2026-10-01
n_days: 10
platforms:
  google_ads:
    utm_source: google
    utm_medium: cpc
    click_window_days: 30          # per_conversion_action carries no window in the row (F1 G10)
lag: {median_days: 4}
order_value: {dist: lognormal, median: 90.0, sigma: 0.5, ad_log_sd: 0.05}
economics:
  variable_cost_per_order: "50.00"
  price_source: modeled_aov
  loss_tolerance: "75.00"
  source: synthetic scenario lag_heavy
  approved_by: scenario file (synthetic)
  approved_at: "2026-11-03T00:00:00+00:00"
ads:
  - variant: A
    platform: google_ads
    account: {id: "123-456-7001", name: Lag Co}
    campaign: {id: "2001", name: Search brand}
    ad_set: {id: "3001", name: Exact}
    ad: {id: "4001", name: RSA A}
    utm_campaign: lag_a
    truth: {ctr: 0.03, cvr: 0.04, cpc: 1.5}
    phases:
      - {days: 10, spend_per_day: "150.00"}
  - variant: B
    platform: google_ads
    account: {id: "123-456-7001", name: Lag Co}
    campaign: {id: "2001", name: Search brand}
    ad_set: {id: "3001", name: Exact}
    ad: {id: "4002", name: RSA B}
    utm_campaign: lag_b
    truth: {ctr: 0.03, cvr: 0.03, cpc: 1.5}
    phases:
      - {days: 10, spend_per_day: "150.00"}
